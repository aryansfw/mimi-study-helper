<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mimi flashcards</title>
<style>
  :root {
    --bg: #1e1e1e;
    --text: #f0f0f0;
    --muted: #a8a8a8;
    --border: #3a3a3a;
    --accent: #9d7cf2;
  }

  body {
    font: 14px/1.5 system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    padding: 24px;
    width: 480px;
  }

  .card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 18px;
    margin: 0;
  }

  #progress {
    color: var(--muted);
  }

  #content {
    max-height: min(60vh, 400px);
    overflow-y: auto;
    margin-bottom: 16px;
  }

  #front {
    font-size: 16px;
    margin: 0;
    white-space: pre-wrap;
  }

  #answer {
    margin: 16px 0 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
  }

  #explanation-toggle {
    display: inline-block;
    margin-top: 12px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    font: inherit;
    padding: 0;
  }

  #explanation {
    margin-top: 8px;
    color: var(--muted);
    white-space: pre-wrap;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  button {
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 6px;
    font: inherit;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    transition: border-color 120ms ease-out, transform 120ms ease-out;
  }

  button:hover {
    border-color: var(--accent);
    transform: scale(1.02);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Mimi flashcards</h1>
      <span id="progress"></span>
    </div>

    <div id="empty-state" hidden>
      <p>No flashcards saved yet.</p>
    </div>

    <div id="quiz-state" hidden>
      <div id="content">
        <p id="front"></p>
        <div id="answer" hidden></div>
        <button id="explanation-toggle" type="button" title="Show or hide the full explanation" hidden>See full explanation</button>
        <div id="explanation" hidden></div>
      </div>
      <div class="row">
        <button id="show-answer" type="button" title="Reveal the answer">Show answer</button>
        <button id="got-it" type="button" title="Mark this card as known" hidden>Got it</button>
        <button id="review-again" type="button" title="Review this card again later" hidden>Review again</button>
      </div>
    </div>

    <div id="done-state" hidden>
      <p id="done-message"></p>
      <button id="restart" type="button" title="Start a new shuffled session">Restart</button>
    </div>
  </div>
  <script src="quiz.js"></script>
</body>
</html>
